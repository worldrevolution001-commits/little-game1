    <!-- AUDIO SYSTEM -->
    <script>
        class SoundSystem {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    var AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
            }

            playTone(freq, type, duration, vol) {
                if (!vol) vol = 0.1;
                if (!this.enabled) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }

                    var osc = this.ctx.createOscillator();
                    var gain = this.ctx.createGain();

                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }

            click() { this.playTone(600, 'sine', 0.05, 0.05); }
            select() { this.playTone(800, 'triangle', 0.08, 0.08); }
            move() { 
                this.playTone(300, 'sine', 0.1, 0.08); 
                var self = this;
                setTimeout(function() { self.playTone(400, 'sine', 0.1, 0.05); }, 80);
            }
            attack() {
                this.playTone(150, 'sawtooth', 0.2, 0.15);
                var self = this;
                setTimeout(function() { self.playTone(90, 'square', 0.25, 0.15); }, 100);
            }
            settle() {
                this.playTone(400, 'sine', 0.15, 0.1);
                var self = this;
                setTimeout(function() { self.playTone(600, 'sine', 0.2, 0.1); }, 150);
                setTimeout(function() { self.playTone(800, 'sine', 0.3, 0.1); }, 300);
            }
            tech() {
                this.playTone(523, 'sine', 0.15, 0.1);
                var self = this;
                setTimeout(function() { self.playTone(659, 'sine', 0.2, 0.1); }, 120);
                setTimeout(function() { self.playTone(783, 'sine', 0.3, 0.1); }, 240);
            }
        }
        var audio = new SoundSystem();
    </script>

        class GameState {
            constructor() {
                this.turn = 1;
                this.year = 800;
                this.playerFactionId = 'anglo_saxon';
                this.enableFog = true;

                this.map = [];
                this.factions = {};
                this.units = [];
                this.settlements = [];

                this.selectedTile = null;
                this.selectedUnit = null;
                this.validMoves = [];

                this.camX = 0;
                this.camY = 0;
                this.zoom = 1.0;

                this.logs = [];
            }

            initMap() {
                this.map = [];
                for (let y = 0; y < MAP_HEIGHT; y++) {
                    const row = [];
                    for (let x = 0; x < MAP_WIDTH; x++) {
                        let typeCode = ISLES_MASK[y] ? ISLES_MASK[y][x] || 0 : 0;
                        
                        let terrainKey = 'OCEAN';
                        if (typeCode === 1) terrainKey = 'COAST';
                        else if (typeCode === 2) terrainKey = 'PLAINS';
                        else if (typeCode === 3) terrainKey = 'FOREST';
                        else if (typeCode === 4) terrainKey = 'HILLS';
                        else if (typeCode === 5) terrainKey = 'MOUNTAIN';
                        else if (typeCode === 6) terrainKey = 'MARSH';

                        row.push({
                            x, y,
                            terrain: terrainKey,
                            visible: !this.enableFog,
                            explored: !this.enableFog,
                            owner: null,
                        });
                    }
                    this.map.push(row);
                }
            }

            setupFactions() {
                this.factions = {};
                Object.keys(FACTIONS).forEach(fKey => {
                    const config = FACTIONS[fKey];
                    this.factions[fKey] = {
                        ...config,
                        gold: 100,
                        food: 60,
                        prod: 30,
                        culture: 0,
                        faith: 0,
                        religion: null,
                        techs: [],
                        currentTech: null,
                        techProgress: 0,
                        isAI: fKey !== this.playerFactionId
                    };
                });
            }

            spawnStartingEntities() {
                this.units = [];
                this.settlements = [];

                let unitIdCounter = 1;
                let cityIdCounter = 1;

                Object.keys(this.factions).forEach(fKey => {
                    const fac = this.factions[fKey];
                    const pos = fac.startPos;

                    const tile = this.getTile(pos.x, pos.y);
                    if (tile) {
                        tile.terrain = 'PLAINS';
                        tile.owner = fKey;
                    }

                    const cityName = this.getFactionCapitalName(fKey);
                    const capital = {
                        id: cityIdCounter++,
                        name: cityName,
                        factionId: fKey,
                        x: pos.x,
                        y: pos.y,
                        pop: 2,
                        buildings: ['barracks'],
                        isCapital: true
                    };
                    this.settlements.push(capital);

                    this.units.push({
                        id: unitIdCounter++,
                        factionId: fKey,
                        type: 'infantry',
                        x: pos.x,
                        y: pos.y,
                        hp: UNITS.infantry.maxHp,
                        movesLeft: UNITS.infantry.moves,
                        hasAttacked: false,
                        isResting: false,
                        isEmbarked: false
                    });

                    this.units.push({
                        id: unitIdCounter++,
                        factionId: fKey,
                        type: 'settler',
                        x: Math.min(MAP_WIDTH - 1, pos.x + 1),
                        y: pos.y,
                        hp: UNITS.settler.maxHp,
                        movesLeft: UNITS.settler.moves,
                        hasAttacked: false,
                        isResting: false,
                        isEmbarked: false
                    });

                    const coastalTile = this.findNearbyCoast(pos.x, pos.y);
                    if (coastalTile) {
                        this.units.push({
                            id: unitIdCounter++,
                            factionId: fKey,
                            type: 'ship',
                            x: coastalTile.x,
                            y: coastalTile.y,
                            hp: UNITS.ship.maxHp,
                            movesLeft: UNITS.ship.moves,
                            hasAttacked: false,
                            isResting: false,
                            cargoUnitId: null
                        });
                    }
                });

                this.updateVisibility();
            }

            getFactionCapitalName(fKey) {
                const names = {
                    anglo_saxon: '溫徹斯特',
                    alba: '斯庫恩城堡',
                    celts: '阿伯弗勞',
                    gaels: '塔拉山丘',
                    vikings: '約克前哨'
                };
                return names[fKey] || '要塞城邦';
            }

            findNearbyCoast(cx, cy) {
                for (let dy = -2; dy <= 2; dy++) {
                    for (let dx = -2; dx <= 2; dx++) {
                        const tile = this.getTile(cx + dx, cy + dy);
                        if (tile && (tile.terrain === 'COAST' || tile.terrain === 'OCEAN')) {
                            return tile;
                        }
                    }
                }
                return null;
            }

            // 檢查城邦周邊一圈地塊是否包含指定地形條件 (sea 或 mountain)
            checkCitySurroundingTerrain(cityX, cityY, typeRequirement) {
                const neighbors = [
                    { dx: 1, dy: 0 }, { dx: -1, dy: 0 },
                    { dx: 0, dy: 1 }, { dx: 0, dy: -1 },
                    { dx: cityY % 2 === 1 ? 1 : -1, dy: 1 },
                    { dx: cityY % 2 === 1 ? 1 : -1, dy: -1 }
                ];

                for (let n of neighbors) {
                    const tile = this.getTile(cityX + n.dx, cityY + n.dy);
                    if (tile) {
                        if (typeRequirement === 'sea' && (tile.terrain === 'COAST' || tile.terrain === 'OCEAN')) {
                            return true;
                        }
                        if (typeRequirement === 'mountain' && (tile.terrain === 'HILLS' || tile.terrain === 'MOUNTAIN')) {
                            return true;
                        }
                    }
                }
                return false;
            }

            getTile(x, y) {
                if (x < 0 || x >= MAP_WIDTH || y < 0 || y >= MAP_HEIGHT) return null;
                return this.map[y][x];
            }

            getUnitAt(x, y) {
                return this.units.find(u => u.x === x && u.y === y && !u.isEmbarked);
            }

            getSettlementAt(x, y) {
                return this.settlements.find(s => s.x === x && s.y === y);
            }

            updateVisibility() {
                if (!this.enableFog) return;

                for (let y = 0; y < MAP_HEIGHT; y++) {
                    for (let x = 0; x < MAP_WIDTH; x++) {
                        this.map[y][x].visible = false;
                    }
                }

                const playerUnits = this.units.filter(u => u.factionId === this.playerFactionId);
                const playerCities = this.settlements.filter(s => s.factionId === this.playerFactionId);

                const revealCircle = (cx, cy, rad) => {
                    for (let dy = -rad; dy <= rad; dy++) {
                        for (let dx = -rad; dx <= rad; dx++) {
                            const tile = this.getTile(cx + dx, cy + dy);
                            if (tile) {
                                tile.visible = true;
                                tile.explored = true;
                            }
                        }
                    }
                };

                playerUnits.forEach(u => revealCircle(u.x, u.y, 2));
                playerCities.forEach(s => revealCircle(s.x, s.y, 3));
            }

            getFactionIncome(fKey) {
                let gold = 5;
                let food = 5;
                let prod = 5;
                let culture = 2;
                let faith = 0;

                const fac = this.factions[fKey];

                if (fKey === 'anglo_saxon') gold += 4;
                if (fKey === 'gaels') culture += 3;

                if (fac.techs.includes('coinage')) gold = Math.floor(gold * 1.25);
                if (fac.techs.includes('crop_rotation')) food += 3;

                const myCities = this.settlements.filter(s => s.factionId === fKey);
                myCities.forEach(city => {
                    gold += 4 + city.pop;
                    food += 3 + city.pop;
                    prod += 3 + city.pop;

                    if (city.buildings.includes('farm')) food += 4;
                    if (city.buildings.includes('market')) gold += 5;
                    if (city.buildings.includes('workshop')) prod += 4;
                    if (city.buildings.includes('academy')) culture += 5;
                    if (city.buildings.includes('harbor')) gold += 6;
                    if (city.buildings.includes('mine')) prod += 5;
                    if (city.buildings.includes('monastery')) faith += 4;
                });

                if (fac.religion === 'celtic_christian') food = Math.floor(food * 1.2);

                const myUnits = this.units.filter(u => u.factionId === fKey);
                gold -= myUnits.length * 1;

                return { gold, food, prod, culture, faith };
            }

            processTurn() {
                Object.keys(this.factions).forEach(fKey => {
                    const fac = this.factions[fKey];
                    const inc = this.getFactionIncome(fKey);

                    fac.gold = Math.max(0, fac.gold + inc.gold);
                    fac.food += inc.food;
                    fac.prod += inc.prod;
                    fac.culture += inc.culture;
                    fac.faith += inc.faith;

                    if (fac.currentTech) {
                        const techObj = TECHNOLOGIES.find(t => t.id === fac.currentTech);
                        if (techObj) {
                            fac.techProgress += inc.culture;
                            if (fac.techProgress >= techObj.cost) {
                                fac.techs.push(techObj.id);
                                if (fKey === this.playerFactionId) {
                                    audio.tech();
                                    this.addLog(`<strong>解鎖新科技：</strong> ${techObj.name}！`);
                                }
                                fac.currentTech = null;
                                fac.techProgress = 0;
                            }
                        }
                    }

                    const myCities = this.settlements.filter(s => s.factionId === fKey);
                    myCities.forEach(city => {
                        if (fac.food >= city.pop * 20) {
                            fac.food -= city.pop * 20;
                            city.pop += 1;
                            if (fKey === this.playerFactionId) {
                                this.addLog(`城邦 <strong>${city.name}</strong> 人口增長至 ${city.pop}！`);
                            }
                        }
                    });

                    if (fac.isAI) {
                        this.processAITurn(fKey);
                    }
                });

                this.units.forEach(u => {
                    const uConfig = UNITS[u.type];
                    u.movesLeft = uConfig.moves;
                    u.hasAttacked = false;

                    if (u.isResting) {
                        if (u.hp < uConfig.maxHp) {
                            const healAmount = Math.ceil(uConfig.maxHp * 0.25);
                            u.hp = Math.min(uConfig.maxHp, u.hp + healAmount);
                            if (u.factionId === this.playerFactionId) {
                                this.addLog(`💚 你的 <strong>${uConfig.name}</strong> 休整完畢，恢復了 ${healAmount} 點生命值！`);
                            }
                        }
                    }
                });

                this.turn += 1;
                this.year += 5;

                this.updateVisibility();
                this.addLog(`第 ${this.turn} 回合 (公元 ${this.year} 年) 開始。`);
            }

            processAITurn(fKey) {
                const aiUnits = this.units.filter(u => u.factionId === fKey);
                aiUnits.forEach(u => {
                    const validMoves = this.calculateValidMoves(u);
                    if (validMoves.length > 0) {
                        const enemyMove = validMoves.find(m => m.isEnemy);
                        if (enemyMove) {
                            this.executeMoveOrAttack(u, enemyMove.x, enemyMove.y);
                        } else {
                            const randomTarget = validMoves[Math.floor(Math.random() * validMoves.length)];
                            if (randomTarget) {
                                this.executeMoveOrAttack(u, randomTarget.x, randomTarget.y);
                            }
                        }
                    }
                });
            }

            calculateValidMoves(unit) {
                const uConfig = UNITS[unit.type];
                if (!uConfig) return [];
                const valid = [];

                let maxRange = uConfig.range || 1;
                if (unit.factionId === 'celts' && unit.type === 'archer') {
                    maxRange += 1;
                }

                for (let dy = -maxRange; dy <= maxRange; dy++) {
                    for (let dx = -maxRange; dx <= maxRange; dx++) {
                        if (dx === 0 && dy === 0) continue;
                        const tx = unit.x + dx;
                        const ty = unit.y + dy;
                        const tile = this.getTile(tx, ty);

                        if (tile) {
                            const terrConfig = TERRAIN[tile.terrain];
                            if (!terrConfig) continue;

                            const targetUnit = this.getUnitAt(tx, ty);

                            if (Math.abs(dx) <= 1 && Math.abs(dy) <= 1) {
                                const isPassable = uConfig.isNaval ? terrConfig.passSea : terrConfig.passLand;
                                if (isPassable && unit.movesLeft > 0) {
                                    if (!targetUnit) {
                                        valid.push({ x: tx, y: ty, isEnemy: false, isRangedAttack: false });
                                    } else if (targetUnit.factionId !== unit.factionId) {
                                        valid.push({ x: tx, y: ty, isEnemy: true, isRangedAttack: uConfig.range > 1 });
                                    }
                                }
                            } else if (maxRange > 1 && targetUnit && targetUnit.factionId !== unit.factionId && unit.movesLeft > 0) {
                                valid.push({ x: tx, y: ty, isEnemy: true, isRangedAttack: true });
                            }
                        }
                    }
                }

                return valid;
            }

            executeMoveOrAttack(attacker, tx, ty) {
                if (!attacker) return;

                attacker.isResting = false;

                const targetUnit = this.getUnitAt(tx, ty);
                const targetCity = this.getSettlementAt(tx, ty);

                const tile = this.getTile(tx, ty);
                const terrConfig = TERRAIN[tile.terrain];
                const moveCost = terrConfig ? terrConfig.moveCost : 1;

                if (targetUnit) {
                    if (attacker.movesLeft <= 0 || attacker.hasAttacked) {
                        this.addLog(`單位無足夠行動力進行攻擊！`);
                        return;
                    }

                    targetUnit.isResting = false;

                    const attackerConfig = UNITS[attacker.type];
                    const targetConfig = UNITS[targetUnit.type];
                    const attFaction = this.factions[attacker.factionId];
                    const defFaction = this.factions[targetUnit.factionId];

                    let attStat = attackerConfig.attack;
                    let defStat = targetConfig.defense;

                    if (attFaction && attFaction.techs.includes('iron_working') && attacker.type === 'infantry') {
                        attStat += 2;
                    }
                    if (attFaction && attFaction.techs.includes('seamanship') && attacker.type === 'ship') {
                        attStat += 4;
                    }

                    const defBonus = terrConfig.defBonus || 0;
                    defStat = Math.round(defStat * (1 + defBonus));

                    if (attacker.factionId === 'alba' && (tile.terrain === 'MOUNTAIN' || tile.terrain === 'HILLS')) {
                        attStat = Math.round(attStat * 1.5);
                    }
                    if (targetUnit.factionId === 'anglo_saxon' && targetUnit.type === 'infantry') {
                        defStat += 2;
                    }

                    const damageToDef = Math.max(2, Math.floor(attStat * (0.8 + Math.random() * 0.4) - defStat * 0.3));
                    targetUnit.hp -= damageToDef;
                    attacker.movesLeft = 0;
                    attacker.hasAttacked = true;

                    audio.attack();
                    this.addLog(`⚔️ <strong>${attFaction.name}</strong> 的 ${attackerConfig.name} 攻擊了 <strong>${defFaction.name}</strong> 的 ${targetConfig.name}，造成 <strong>${damageToDef}</strong> 傷害！`);

                    if (targetUnit.hp <= 0) {
                        if (targetUnit.cargoUnitId) {
                            this.units = this.units.filter(u => u.id !== targetUnit.cargoUnitId);
                            this.addLog(`💀 艦艇沉沒！搭載的陸軍部隊一併溺亡！`);
                        }
                        this.units = this.units.filter(u => u !== targetUnit);
                        this.addLog(`💥 <strong>${defFaction.name}</strong> 的 ${targetConfig.name} 被摧毀了！`);

                        if (attackerConfig.range <= 1) {
                            attacker.x = tx;
                            attacker.y = ty;
                            if (attacker.cargoUnitId) {
                                const cargo = this.units.find(u => u.id === attacker.cargoUnitId);
                                if (cargo) { cargo.x = tx; cargo.y = ty; }
                            }
                        }

                        if (attacker.factionId === 'vikings') {
                            attFaction.gold += 15;
                            this.addLog(`🏴‍☠️ 維京掠奪者獲得了 15 黃金戰利品！`);
                        }
                    } else {
                        const isAdjacent = Math.abs(attacker.x - tx) <= 1 && Math.abs(attacker.y - ty) <= 1;
                        if (isAdjacent && attackerConfig.range <= 1 && targetConfig.range <= 1) {
                            const counterDmg = Math.max(1, Math.floor(defStat * 0.4 - attStat * 0.2));
                            attacker.hp -= counterDmg;
                            this.addLog(`🛡️ 反擊！${targetConfig.name} 反擊造成 <strong>${counterDmg}</strong> 傷害。`);
                            if (attacker.hp <= 0) {
                                if (attacker.cargoUnitId) {
                                    this.units = this.units.filter(u => u.id !== attacker.cargoUnitId);
                                    this.addLog(`💀 您的艦艇沉沒，搭載的陸軍亦葬身大海！`);
                                }
                                this.units = this.units.filter(u => u !== attacker);
                                this.selectedUnit = null;
                                this.addLog(`💀 您的 ${attackerConfig.name} 在反擊中陣亡！`);
                            }
                        }
                    }

                } else {
                    if (attacker.movesLeft >= moveCost) {
                        attacker.x = tx;
                        attacker.y = ty;
                        attacker.movesLeft = Math.max(0, attacker.movesLeft - moveCost);
                        audio.move();

                        if (attacker.cargoUnitId) {
                            const cargo = this.units.find(u => u.id === attacker.cargoUnitId);
                            if (cargo) {
                                cargo.x = tx;
                                cargo.y = ty;
                            }
                        }

                        if (targetCity && targetCity.factionId !== attacker.factionId) {
                            const oldFac = this.factions[targetCity.factionId];
                            const newFac = this.factions[attacker.factionId];
                            targetCity.factionId = attacker.factionId;
                            tile.owner = attacker.factionId;
                            this.addLog(`🏰 <strong>${newFac.name}</strong> 佔領了 <strong>${oldFac.name}</strong> 的城邦 <strong>${targetCity.name}</strong>！`);
                        }
                    } else {
                        this.addLog(`移動力不足！`);
                    }
                }

                this.updateVisibility();
                this.validMoves = [];
            }

            foundSettlement(unit) {
                if (!unit || unit.type !== 'settler') return;

                const tile = this.getTile(unit.x, unit.y);
                if (!tile || !TERRAIN[tile.terrain].passLand) {
                    this.addLog("無法在此地形建立城邦！");
                    return;
                }

                if (this.getSettlementAt(unit.x, unit.y)) {
                    this.addLog("此地點已存在城邦！");
                    return;
                }

                const fac = this.factions[unit.factionId];
                const newCityId = Date.now();
                const cityName = `城邦 ${this.settlements.length + 1}`;

                const newCity = {
                    id: newCityId,
                    name: cityName,
                    factionId: unit.factionId,
                    x: unit.x,
                    y: unit.y,
                    pop: 1,
                    buildings: [],
                    isCapital: false
                };

                this.settlements.push(newCity);
                tile.owner = unit.factionId;

                // 移除拓荒者單位
                this.units = this.units.filter(u => u.id !== unit.id);
                this.selectedUnit = null;
                this.validMoves = [];

                audio.settle();
                this.addLog(`🏰 <strong>${fac.name}</strong> 在 (${unit.x}, ${unit.y}) 建立了新城邦 <strong>${cityName}</strong>！`);
                this.updateVisibility();
            }

            spreadReligion(missionaryUnit) {
                if (!missionaryUnit || missionaryUnit.type !== 'missionary') return;

                const city = this.getSettlementAt(missionaryUnit.x, missionaryUnit.y);
                if (!city) {
                    this.addLog("傳教士必須處於城邦地塊內才能傳播宗教！");
                    return;
                }

                const fac = this.factions[missionaryUnit.factionId];
                if (!fac.religion) {
                    this.addLog("王國尚未創立宗教，無法傳播福音！");
                    return;
                }

                city.religion = fac.religion;
                city.pop += 1;
                fac.gold += 30;

                this.units = this.units.filter(u => u.id !== missionaryUnit.id);
                this.selectedUnit = null;
                this.validMoves = [];

                audio.settle();
                this.addLog(`✨ 傳教士在 <strong>${city.name}</strong> 成功傳播了福音！城邦人口 +1 並獲得 30 聖金！`);
                this.updateVisibility();
            }

            toggleRestUnit(unit) {
                if (!unit) return;
                unit.isResting = !unit.isResting;
                if (unit.isResting) {
                    unit.movesLeft = 0;
                    this.addLog(`💤 單位已進入休整駐扎狀態，每回合恢復生命值。`);
                } else {
                    this.addLog(`⚔️ 單位已解除休整狀態。`);
                }
            }

            boardShip(landUnit, shipUnit) {
                if (!landUnit || !shipUnit) return;
                if (shipUnit.cargoUnitId) {
                    this.addLog(`艦艇已有搭載單位，無法再登船！`);
                    return;
                }
                shipUnit.cargoUnitId = landUnit.id;
                landUnit.isEmbarked = true;
                landUnit.x = shipUnit.x;
                landUnit.y = shipUnit.y;
                landUnit.movesLeft = 0;

                this.selectedUnit = shipUnit;
                this.validMoves = [];
                audio.settle();
                this.addLog(`⛵ <strong>${UNITS[landUnit.type].name}</strong> 已登船，進入渡海載運狀態！`);
                this.updateVisibility();
            }

            disembarkUnit(shipUnit, targetX, targetY) {
                if (!shipUnit || !shipUnit.cargoUnitId) return;
                const cargo = this.units.find(u => u.id === shipUnit.cargoUnitId);
                const tile = this.getTile(targetX, targetY);

                if (!cargo || !tile) return;
                const terrConfig = TERRAIN[tile.terrain];
                if (!terrConfig || !terrConfig.passLand) {
                    this.addLog(`該地點無法進行陸軍登陸！`);
                    return;
                }

                if (this.getUnitAt(targetX, targetY)) {
                    this.addLog(`目標地塊已有其他單位！`);
                    return;
                }

                cargo.isEmbarked = false;
                cargo.x = targetX;
                cargo.y = targetY;
                cargo.movesLeft = 0;
                shipUnit.cargoUnitId = null;

                this.selectedUnit = cargo;
                this.validMoves = [];
                audio.settle();
                this.addLog(`⚔️ <strong>${UNITS[cargo.type].name}</strong> 成功搶灘登陸至 (${targetX}, ${targetY})！`);
                this.updateVisibility();
            }

            addLog(msg) {
                this.logs.unshift(msg);
                if (this.logs.length > 20) this.logs.pop();
                
                const logContainer = document.getElementById('log-messages');
                if (logContainer) {
                    logContainer.innerHTML = this.logs.map(l => `<p class="leading-snug">${l}</p>`).join('');
                }
            }
        }

        const game = new GameState();

        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            render();
        }
        window.addEventListener('resize', resizeCanvas);

        function hexToPixel(hx, hy) {
            const xSp = HEX_RADIUS * 1.732;
            const ySp = HEX_RADIUS * 1.5;
            const xOffset = (hy % 2 === 1) ? xSp / 2 : 0;

            const px = hx * xSp + xOffset + game.camX;
            const py = hy * ySp + game.camY;
            return { x: px, y: py };
        }

        function pixelToHex(px, py) {
            const worldX = px - game.camX;
            const worldY = py - game.camY;

            const ySp = HEX_RADIUS * 1.5;
            const hy = Math.round(worldY / ySp);
            const xOffset = (Math.abs(hy) % 2 === 1) ? (HEX_RADIUS * 1.732) / 2 : 0;
            const hx = Math.round((worldX - xOffset) / (HEX_RADIUS * 1.732));

            return { x: hx, y: hy };
        }

        function drawHexagon(cx, cy, radius, fillColor, strokeColor, lineWidth = 1) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 180) * (60 * i - 30);
                const x = cx + radius * Math.cos(angle);
                const y = cy + radius * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();

            if (fillColor) {
                ctx.fillStyle = fillColor;
                ctx.fill();
            }
            if (strokeColor) {
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = lineWidth;
                ctx.stroke();
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < MAP_HEIGHT; y++) {
                for (let x = 0; x < MAP_WIDTH; x++) {
                    const tile = game.map[y][x];
                    const center = hexToPixel(x, y);

                    if (center.x < -HEX_RADIUS * 2 || center.x > canvas.width + HEX_RADIUS * 2 ||
                        center.y < -HEX_RADIUS * 2 || center.y > canvas.height + HEX_RADIUS * 2) {
                        continue;
                    }

                    if (game.enableFog && !tile.explored) {
                        drawHexagon(center.x, center.y, HEX_RADIUS, '#020617', '#0f172a');
                        continue;
                    }

                    const terrConfig = TERRAIN[tile.terrain];
                    let color = terrConfig.color;

                    if (game.enableFog && !tile.visible) {
                        color = '#1e293b';
                    }

                    let borderCol = 'rgba(255,255,255,0.08)';
                    let borderWidth = 1;
                    if (tile.owner && game.factions[tile.owner]) {
                        borderCol = game.factions[tile.owner].color;
                        borderWidth = 2;
                    }

                    drawHexagon(center.x, center.y, HEX_RADIUS, color, borderCol, borderWidth);

                    if (tile.visible || !game.enableFog) {
                        if (tile.terrain === 'FOREST') {
                            ctx.fillStyle = '#065f46';
                            ctx.font = '12px "Font Awesome 6 Free"';
                            ctx.fillText('🌲', center.x - 6, center.y + 4);
                        } else if (tile.terrain === 'MOUNTAIN') {
                            ctx.fillStyle = '#94a3b8';
                            ctx.font = '12px "Font Awesome 6 Free"';
                            ctx.fillText('⛰️', center.x - 8, center.y + 4);
                        }
                    }
                }
            }

            game.validMoves.forEach(m => {
                const center = hexToPixel(m.x, m.y);
                const highlightCol = m.isEnemy ? 'rgba(239, 68, 68, 0.4)' : 'rgba(59, 130, 246, 0.4)';
                const borderCol = m.isEnemy ? '#ef4444' : '#60a5fa';
                drawHexagon(center.x, center.y, HEX_RADIUS - 2, highlightCol, borderCol, 2);
            });

            game.settlements.forEach(city => {
                const tile = game.getTile(city.x, city.y);
                if (game.enableFog && !tile.visible && !tile.explored) return;

                const center = hexToPixel(city.x, city.y);
                const fac = game.factions[city.factionId];

                ctx.fillStyle = fac ? fac.color : '#64748b';
                ctx.beginPath();
                ctx.arc(center.x, center.y, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fef08a';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(city.isCapital ? '👑' : '🏰', center.x, center.y);

                ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                ctx.fillRect(center.x - 35, center.y + 16, 70, 16);
                ctx.strokeStyle = fac ? fac.color : '#94a3b8';
                ctx.strokeRect(center.x - 35, center.y + 16, 70, 16);

                ctx.fillStyle = '#f8fafc';
                ctx.font = '10px Inter, sans-serif';
                ctx.fillText(city.name, center.x, center.y + 24);
            });

            game.units.forEach(unit => {
                if (unit.isEmbarked) return;

                const tile = game.getTile(unit.x, unit.y);
                if (game.enableFog && !tile.visible) return;

                const center = hexToPixel(unit.x, unit.y);
                const fac = game.factions[unit.factionId];
                const uConfig = UNITS[unit.type];

                const isSelected = game.selectedUnit === unit;

                if (isSelected) {
                    ctx.strokeStyle = '#f59e0b';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(center.x, center.y, 18, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.fillStyle = fac ? fac.color : '#475569';
                ctx.beginPath();
                ctx.arc(center.x, center.y, 13, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = unit.isResting ? '#38bdf8' : (isSelected ? '#ffffff' : '#1e293b');
                ctx.lineWidth = unit.isResting ? 3 : 2;
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                let symbol = '⚔️';
                if (unit.type === 'settler') symbol = '⛺';
                if (unit.type === 'missionary') symbol = '✝️';
                if (unit.type === 'archer') symbol = '🏹';
                if (unit.type === 'cavalry') symbol = '🐎';
                if (unit.type === 'ship') symbol = '⛵';

                ctx.fillText(symbol, center.x, center.y);

                if (unit.isResting) {
                    ctx.fillStyle = '#38bdf8';
                    ctx.font = '10px sans-serif';
                    ctx.fillText('💤', center.x + 10, center.y - 10);
                } else if (unit.cargoUnitId) {
                    ctx.fillStyle = '#f59e0b';
                    ctx.font = '10px sans-serif';
                    ctx.fillText('🪖', center.x + 10, center.y - 10);
                }

                const hpPct = unit.hp / uConfig.maxHp;
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(center.x - 12, center.y - 18, 24, 4);
                ctx.fillStyle = hpPct > 0.5 ? '#22c55e' : (hpPct > 0.25 ? '#eab308' : '#ef4444');
                ctx.fillRect(center.x - 12, center.y - 18, Math.max(0, 24 * hpPct), 4);
            });

            if (game.selectedTile) {
                const center = hexToPixel(game.selectedTile.x, game.selectedTile.y);
                drawHexagon(center.x, center.y, HEX_RADIUS, null, '#f59e0b', 3);
            }
        }

        let isDragging = false;
        let dragStart = { x: 0, y: 0 };

        function centerCameraOn(x, y) {
            const p = hexToPixel(x, y);
            game.camX += canvas.width / 2 - p.x;
            game.camY += canvas.height / 2 - p.y;
            render();
        }

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                isDragging = true;
                dragStart = { x: e.clientX, y: e.clientY };
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const dx = e.clientX - dragStart.x;
                const dy = e.clientY - dragStart.y;
                game.camX += dx;
                game.camY += dy;
                dragStart = { x: e.clientX, y: e.clientY };
                render();
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (isDragging) {
                const distMoved = Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y);
                isDragging = false;

                if (distMoved < 5) {
                    handleMapClick(e.clientX, e.clientY);
                }
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length === 1) {
                e.preventDefault();
                const dx = e.touches[0].clientX - dragStart.x;
                const dy = e.touches[0].clientY - dragStart.y;
                game.camX += dx;
                game.camY += dy;
                dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                render();
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            if (isDragging) {
                const touch = e.changedTouches[0];
                const distMoved = Math.hypot(touch.clientX - dragStart.x, touch.clientY - dragStart.y);
                isDragging = false;

                if (distMoved < 10) {
                    handleMapClick(touch.clientX, touch.clientY);
                }
            }
        });

        function handleMapClick(screenX, screenY) {
            const hex = pixelToHex(screenX, screenY);
            const tile = game.getTile(hex.x, hex.y);

            if (!tile) return;

            audio.select();
            game.selectedTile = hex;

            const clickedUnit = game.getUnitAt(hex.x, hex.y);
            const clickedCity = game.getSettlementAt(hex.x, hex.y);

            if (game.selectedUnit && game.selectedUnit.factionId === game.playerFactionId) {
                const isMoveTarget = game.validMoves.some(m => m.x === hex.x && m.y === hex.y);
                if (isMoveTarget) {
                    game.executeMoveOrAttack(game.selectedUnit, hex.x, hex.y);
                    updateUI();
                    render();
                    return;
                }
            }

            if (clickedUnit) {
                game.selectedUnit = clickedUnit;
                game.validMoves = (clickedUnit.factionId === game.playerFactionId) ? game.calculateValidMoves(clickedUnit) : [];
            } else {
                game.selectedUnit = null;
                game.validMoves = [];
            }

            if (clickedCity && clickedCity.factionId === game.playerFactionId) {
                openCityModal(clickedCity);
            }

            updateUI();
            render();
        }

        function updateUI() {
            const pFac = game.factions[game.playerFactionId];
            const inc = game.getFactionIncome(game.playerFactionId);

            document.getElementById('faction-name').innerText = pFac.name;
            document.getElementById('turn-display').innerText = `第 ${game.turn} 回合 (公元 ${game.year} 年)`;

            const banner = document.getElementById('faction-banner');
            banner.className = `w-8 h-8 rounded border border-amber-400 flex items-center justify-center font-bold text-lg shadow-md ${pFac.bgTailwind} text-white`;
            banner.innerHTML = `<i class="fa-solid ${pFac.icon}"></i>`;

            document.getElementById('res-gold').innerText = pFac.gold;
            document.getElementById('income-gold').innerText = `(${inc.gold >= 0 ? '+' : ''}${inc.gold})`;

            document.getElementById('res-food').innerText = pFac.food;
            document.getElementById('income-food').innerText = `(+${inc.food})`;

            document.getElementById('res-prod').innerText = pFac.prod;
            document.getElementById('income-prod').innerText = `(+${inc.prod})`;

            document.getElementById('res-culture').innerText = pFac.culture;
            document.getElementById('income-culture').innerText = `(+${inc.culture})`;

            document.getElementById('res-faith').innerText = pFac.faith;
            document.getElementById('income-faith').innerText = `(+${inc.faith})`;

            const inspector = document.getElementById('inspector-panel');

            if (game.selectedUnit) {
                const u = game.selectedUnit;
                const uConfig = UNITS[u.type];
                const uFac = game.factions[u.factionId];

                let cargoInfo = '';
                if (u.cargoUnitId) {
                    const cargo = game.units.find(c => c.id === u.cargoUnitId);
                    if (cargo) {
                        cargoInfo = `<div class="flex justify-between text-amber-300 font-semibold"><span>搭載部隊：</span> <span>${UNITS[cargo.type].name} (HP ${cargo.hp})</span></div>`;
                    }
                }

                inspector.classList.remove('hidden');
                inspector.innerHTML = `
                    <div class="flex justify-between items-center border-b border-amber-900/60 pb-2 mb-2">
                        <div class="font-medieval font-bold text-amber-400 text-sm flex items-center gap-2">
                            <i class="fa-solid ${uConfig.icon}"></i> ${uConfig.name}
                        </div>
                        <span class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-amber-200 border border-amber-800">${uFac.name}</span>
                    </div>
                    <div class="space-y-1.5 text-xs text-slate-300">
                        <div class="flex justify-between"><span>生命值：</span> <span class="font-bold text-emerald-400">${u.hp} / ${uConfig.maxHp}</span></div>
                        <div class="flex justify-between"><span>移動力：</span> <span class="font-bold text-cyan-400">${u.movesLeft} / ${uConfig.moves}</span></div>
                        <div class="flex justify-between"><span>攻擊力：</span> <span class="font-bold text-amber-400">${uConfig.attack}</span></div>
                        <div class="flex justify-between"><span>攻擊距離：</span> <span class="font-bold text-cyan-300">${uConfig.range || 1} 格</span></div>
                        ${cargoInfo}
                        <div class="flex justify-between"><span>當前狀態：</span> <span class="font-bold ${u.isResting ? 'text-sky-400' : 'text-slate-200'}">${u.isResting ? '💤 休整中 (回復HP)' : '準備行動'}</span></div>
                        <p class="text-[11px] text-amber-200/70 italic border-t border-amber-900/40 pt-1 mt-1">${uConfig.desc}</p>
                    </div>
                `;

                const quickActions = document.getElementById('quick-actions');
                quickActions.classList.remove('hidden');
                let actionsHTML = '';

                if (u.factionId === game.playerFactionId) {
                    if (u.type === 'settler') {
                        actionsHTML += `
                            <button onclick="game.foundSettlement(game.selectedUnit); updateUI(); render();" class="medieval-btn px-3 py-1.5 rounded font-medieval text-xs flex items-center gap-1.5">
                                <i class="fa-solid fa-campground text-amber-300"></i> 建立城邦
                            </button>
                        `;
                    }

                    if (u.type === 'missionary') {
                        actionsHTML += `
                            <button onclick="game.spreadReligion(game.selectedUnit); updateUI(); render();" class="medieval-btn px-3 py-1.5 rounded font-medieval text-xs flex items-center gap-1.5 bg-purple-900 border-purple-500">
                                <i class="fa-solid fa-cross text-purple-300"></i> 傳播宗教
                            </button>
                        `;
                    }

                    if (uConfig.isNaval && u.cargoUnitId) {
                        const neighbors = [
                            { dx: 1, dy: 0 }, { dx: -1, dy: 0 },
                            { dx: 0, dy: 1 }, { dx: 0, dy: -1 },
                            { dx: u.y % 2 === 1 ? 1 : -1, dy: 1 },
                            { dx: u.y % 2 === 1 ? 1 : -1, dy: -1 }
                        ];
                        const landTile = neighbors.map(n => game.getTile(u.x + n.dx, u.y + n.dy))
                                                .find(t => t && TERRAIN[t.terrain].passLand && !game.getUnitAt(t.x, t.y));
                        if (landTile) {
                            actionsHTML += `
                                <button onclick="game.disembarkUnit(game.selectedUnit, ${landTile.x}, ${landTile.y}); updateUI(); render();" class="medieval-btn px-3 py-1.5 rounded font-medieval text-xs flex items-center gap-1.5 bg-amber-900 border-amber-500">
                                    <i class="fa-solid fa-person-military-pointing text-yellow-300"></i> 搶灘登陸 (${landTile.x}, ${landTile.y})
                                </button>
                            `;
                        }
                    }

                    actionsHTML += `
                        <button onclick="game.toggleRestUnit(game.selectedUnit); updateUI(); render();" class="medieval-btn px-3 py-1.5 rounded font-medieval text-xs flex items-center gap-1.5 ${u.isResting ? 'bg-sky-900 border-sky-500' : ''}">
                            <i class="fa-solid ${u.isResting ? 'fa-person-walking' : 'fa-bed'} text-cyan-300"></i> ${u.isResting ? '解除休整' : '原地休整'}
                        </button>
                    `;
                }

                actionsHTML += `<span class="text-slate-400 text-[11px]">點擊高亮地塊移動或攻擊</span>`;
                quickActions.innerHTML = actionsHTML;

            } else if (game.selectedTile) {
                const tile = game.getTile(game.selectedTile.x, game.selectedTile.y);
                const city = game.getSettlementAt(game.selectedTile.x, game.selectedTile.y);
                const terr = TERRAIN[tile.terrain];

                inspector.classList.remove('hidden');
                document.getElementById('quick-actions').classList.add('hidden');

                inspector.innerHTML = `
                    <div class="font-medieval font-bold text-amber-400 text-sm border-b border-amber-900/60 pb-1 mb-2 flex items-center gap-2">
                        <i class="fa-solid fa-map-location-dot"></i> ${terr.name} (${tile.x}, ${tile.y})
                    </div>
                    <div class="space-y-1 text-xs text-slate-300">
                        <div class="flex justify-between"><span>移動消耗：</span> <span class="font-bold">${terr.moveCost} AP</span></div>
                        <div class="flex justify-between"><span>防禦加成：</span> <span class="font-bold">${Math.round((terr.defBonus || 0) * 100)}%</span></div>
                        ${city ? `<div class="mt-2 p-1.5 bg-amber-950/60 border border-amber-800 rounded">
                            <div class="font-bold text-amber-300">${city.name}</div>
                            <div class="text-[11px] text-slate-300">人口：${city.pop} | 歸屬：${game.factions[city.factionId].name}</div>
                        </div>` : ''}
                    </div>
                `;
            } else {
                inspector.classList.add('hidden');
                document.getElementById('quick-actions').classList.add('hidden');
            }
        }

        function initFactionSelectionModal() {
            const container = document.getElementById('faction-card-container');
            container.innerHTML = '';

            Object.keys(FACTIONS).forEach(fKey => {
                const fac = FACTIONS[fKey];
                const card = document.createElement('div');
                card.className = `medieval-panel p-4 cursor-pointer transition-all hover:scale-105 flex flex-col justify-between border-2 ${fac.id === game.playerFactionId ? 'border-amber-400 bg-amber-950/40' : 'border-amber-900/60'}`;
                card.onclick = () => {
                    game.playerFactionId = fac.id;
                    audio.select();
                    initFactionSelectionModal();
                };

                card.innerHTML = `
                    <div class="space-y-2">
                        <div class="w-12 h-12 rounded-lg ${fac.bgTailwind} text-white flex items-center justify-center text-2xl border border-amber-300 shadow-md mx-auto mb-2">
                            <i class="fa-solid ${fac.icon}"></i>
                        </div>
                        <h3 class="font-medieval font-bold text-base text-amber-300 text-center">${fac.name}</h3>
                        <p class="text-xs text-slate-400 text-center font-semibold">${fac.leader}</p>
                        <p class="text-[11px] text-amber-100/80 leading-snug border-t border-amber-900/40 pt-2 mt-2">${fac.bonus}</p>
                    </div>
                    <div class="mt-4 text-center">
                        <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-1 rounded bg-slate-900 border border-amber-800 text-amber-400">
                            ${fac.region}
                        </span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openReligionModal() {
            audio.click();
            const modal = document.getElementById('modal-religion');
            const content = document.getElementById('religion-content');
            const pFac = game.factions[game.playerFactionId];

            content.innerHTML = '';

            if (pFac.religion) {
                const relInfo = RELIGIONS[pFac.religion];
                content.innerHTML = `
                    <div class="medieval-panel p-4 text-center space-y-3 bg-purple-950/40 border-purple-600">
                        <div class="w-14 h-14 rounded-full bg-purple-900/80 border-2 border-purple-400 text-purple-200 text-3xl flex items-center justify-center mx-auto">
                            <i class="fa-solid ${relInfo.icon}"></i>
                        </div>
                        <h3 class="font-title text-xl text-purple-300">${relInfo.name}</h3>
                        <p class="text-xs text-amber-200/80 font-semibold">${relInfo.bonus}</p>
                        <p class="text-[11px] text-slate-300 italic">${relInfo.desc}</p>
                        <div class="border-t border-purple-900/60 pt-2 text-xs text-purple-300 font-bold">
                            傳教士已在解鎖列表中，可在城邦招募！
                        </div>
                    </div>
                `;
            } else {
                let html = `
                    <div class="text-center space-y-1 mb-3">
                        <p class="text-xs text-slate-300">信仰值達到 <strong>50 點</strong>即可創立國家宗教，並解鎖虔誠傳教士！</p>
                        <div class="text-sm font-bold ${pFac.faith >= 50 ? 'text-emerald-400' : 'text-rose-400'}">當前王國信仰值：${pFac.faith} / 50</div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                `;

                Object.keys(RELIGIONS).forEach(rKey => {
                    const r = RELIGIONS[rKey];
                    html += `
                        <div class="p-3 bg-slate-900/80 rounded border border-purple-900/50 flex flex-col justify-between space-y-2">
                            <div>
                                <div class="font-medieval font-bold text-purple-300 text-sm flex items-center gap-2">
                                    <i class="fa-solid ${r.icon}"></i> ${r.name}
                                </div>
                                <div class="text-[11px] text-amber-300 mt-1 font-semibold">${r.bonus}</div>
                                <div class="text-[10px] text-slate-400 italic">${r.desc}</div>
                            </div>
                            <button onclick="foundReligion('${rKey}')" ${pFac.faith < 50 ? 'disabled' : ''} class="medieval-btn py-1.5 rounded text-xs w-full bg-purple-900 border-purple-500">
                                創立信仰 (需 50 信仰)
                            </button>
                        </div>
                    `;
                });

                html += `</div>`;
                content.innerHTML = html;
            }

            modal.classList.remove('hidden');
        }

        function openTechModal() {
            audio.click();
            const modal = document.getElementById('modal-tech');
            const techList = document.getElementById('tech-list');
            const pFac = game.factions[game.playerFactionId];

            techList.innerHTML = '';

            TECHNOLOGIES.forEach(tech => {
                const isResearched = pFac.techs.includes(tech.id);
                const isCurrent = pFac.currentTech === tech.id;

                const item = document.createElement('div');
                item.className = `p-3 rounded border flex flex-col md:flex-row justify-between items-start md:items-center gap-3 ${
                    isResearched ? 'bg-emerald-950/40 border-emerald-600/60' :
                    isCurrent ? 'bg-cyan-950/50 border-cyan-400' : 'bg-slate-900/80 border-amber-900/40'
                }`;

                let btnHTML = '';
                if (isResearched) {
                    btnHTML = `<span class="text-emerald-400 text-xs font-bold flex items-center gap-1"><i class="fa-solid fa-check"></i> 已研發</span>`;
                } else if (isCurrent) {
                    btnHTML = `<span class="text-cyan-300 text-xs font-bold animate-pulse">研發中 (${pFac.techProgress}/${tech.cost})</span>`;
                } else {
                    btnHTML = `<button onclick="startResearch('${tech.id}')" class="medieval-btn px-3 py-1.5 rounded text-xs font-medieval">開始研發 (需求 ${tech.cost} 文化)</button>`;
                }

                item.innerHTML = `
                    <div class="space-y-1">
                        <div class="flex items-center gap-2">
                            <span class="text-xs px-2 py-0.5 rounded bg-amber-950 border border-amber-800 text-amber-300 font-semibold">${tech.era}</span>
                            <span class="font-medieval font-bold text-amber-200 text-sm flex items-center gap-1.5">
                                <i class="fa-solid ${tech.icon}"></i> ${tech.name}
                            </span>
                        </div>
                        <p class="text-xs text-slate-300">${tech.desc}</p>
                    </div>
                    <div class="shrink-0">${btnHTML}</div>
                `;
                techList.appendChild(item);
            });

            modal.classList.remove('hidden');
        }

        function startResearch(techId) {
            const pFac = game.factions[game.playerFactionId];
            pFac.currentTech = techId;
            pFac.techProgress = 0;
            audio.click();
            game.addLog(`📜 王國學者開始針對 <strong>${TECHNOLOGIES.find(t=>t.id===techId).name}</strong> 展開學術研究！`);
            openTechModal();
            updateUI();
        }

        function foundReligion(relKey) {
            const pFac = game.factions[game.playerFactionId];
            if (pFac.faith < 50) return;

            pFac.faith -= 50;
            pFac.religion = relKey;
            audio.tech();
            game.addLog(`✨ 偉大的創舉！陛下為王國創立了國教 <strong>${RELIGIONS[relKey].name}</strong>！解鎖傳教士！`);
            openReligionModal();
            updateUI();
        }

        function openCityModal(city) {
            audio.click();
            const modal = document.getElementById('modal-city');
            const pFac = game.factions[game.playerFactionId];

            document.getElementById('city-modal-title').innerText = city.name;
            document.getElementById('city-modal-sub').innerText = `人口：${city.pop} | 統治王國：${pFac.name}`;

            const recruitList = document.getElementById('city-recruit-list');
            recruitList.innerHTML = '';

            Object.keys(UNITS).forEach(uKey => {
                const u = UNITS[uKey];
                
                // 傳教士解鎖限制
                if (uKey === 'missionary' && !pFac.religion) return;

                const btn = document.createElement('div');
                btn.className = "p-2 bg-slate-800/80 rounded border border-amber-900/40 flex justify-between items-center text-xs";
                const costStr = u.costFaith ? `信仰: ${u.costFaith}` : `黃金: ${u.costGold}`;
                btn.innerHTML = `
                    <div>
                        <div class="font-bold text-amber-200"><i class="fa-solid ${u.icon} mr-1"></i> ${u.name}</div>
                        <div class="text-[10px] text-slate-400">${costStr} | 產能: ${u.costProd}</div>
                    </div>
                    <button onclick="recruitUnit('${city.id}', '${uKey}')" class="medieval-btn px-2.5 py-1 rounded text-[11px]">
                        招募
                    </button>
                `;
                recruitList.appendChild(btn);
            });

            const buildList = document.getElementById('city-build-list');
            buildList.innerHTML = '';

            Object.keys(BUILDINGS).forEach(bKey => {
                const b = BUILDINGS[bKey];
                const isBuilt = city.buildings.includes(bKey);

                let meetsReq = true;
                if (b.req) {
                    meetsReq = game.checkCitySurroundingTerrain(city.x, city.y, b.req);
                }

                const btn = document.createElement('div');
                btn.className = `p-2 rounded border flex justify-between items-center text-xs ${
                    isBuilt ? 'bg-emerald-950/40 border-emerald-700/50' : 'bg-slate-800/80 border-amber-900/40'
                }`;

                let statusHTML = '';
                if (isBuilt) {
                    statusHTML = `<span class="text-emerald-400 font-semibold text-[11px]">已興建</span>`;
                } else if (!meetsReq) {
                    statusHTML = `<span class="text-rose-400 font-semibold text-[10px]" title="${b.reqText}">${b.reqText}</span>`;
                } else {
                    statusHTML = `
                        <button onclick="constructBuilding('${city.id}', '${bKey}')" class="medieval-btn px-2.5 py-1 rounded text-[11px]">
                            興建
                        </button>
                    `;
                }

                btn.innerHTML = `
                    <div>
                        <div class="font-bold text-amber-200"><i class="fa-solid ${b.icon} mr-1"></i> ${b.name}</div>
                        <div class="text-[10px] text-slate-400">黃金: ${b.costGold} | 產能: ${b.costProd} (${b.bonusDesc})</div>
                    </div>
                    <div>${statusHTML}</div>
                `;
                buildList.appendChild(btn);
            });

            modal.classList.remove('hidden');
        }

        function recruitUnit(cityId, unitType) {
            const city = game.settlements.find(s => s.id == cityId);
            const uConfig = UNITS[unitType];
            const pFac = game.factions[game.playerFactionId];

            if (uConfig.costFaith && pFac.faith < uConfig.costFaith) {
                game.addLog("信仰點數不足，無法招募傳教士！");
                audio.click();
                return;
            }

            if (uConfig.costGold && pFac.gold < uConfig.costGold) {
                game.addLog("黃金不足，無法招募該單位！");
                audio.click();
                return;
            }

            if (pFac.prod < uConfig.costProd) {
                game.addLog("產能不足，無法招募該單位！");
                audio.click();
                return;
            }

            if (uConfig.costFaith) pFac.faith -= uConfig.costFaith;
            if (uConfig.costGold) pFac.gold -= uConfig.costGold;
            pFac.prod -= uConfig.costProd;

            let targetX = city.x;
            let targetY = city.y;

            if (game.getUnitAt(targetX, targetY)) {
                const neighbors = [
                    { dx: 1, dy: 0 }, { dx: -1, dy: 0 },
                    { dx: 0, dy: 1 }, { dx: 0, dy: -1 },
                    { dx: city.y % 2 === 1 ? 1 : -1, dy: 1 },
                    { dx: city.y % 2 === 1 ? 1 : -1, dy: -1 }
                ];
                const freeTile = neighbors.map(n => game.getTile(city.x + n.dx, city.y + n.dy))
                                          .find(t => t && (uConfig.isNaval ? TERRAIN[t.terrain].passSea : TERRAIN[t.terrain].passLand) && !game.getUnitAt(t.x, t.y));
                if (freeTile) {
                    targetX = freeTile.x;
                    targetY = freeTile.y;
                } else {
                    pFac.gold += uConfig.costGold;
                    pFac.prod += uConfig.costProd;
                    game.addLog("城邦周圍沒有空餘位置可部署單位！");
                    audio.click();
                    return;
                }
            }

            const newUnit = {
                id: Date.now(),
                factionId: game.playerFactionId,
                type: unitType,
                x: targetX,
                y: targetY,
                hp: uConfig.maxHp,
                movesLeft: 0,
                hasAttacked: false,
                isResting: false,
                isEmbarked: false
            };

            game.units.push(newUnit);
            audio.settle();
            game.addLog(`🎖️ 在 <strong>${city.name}</strong> 招募了新的 <strong>${uConfig.name}</strong>！`);
            
            game.updateVisibility();
            openCityModal(city);
            updateUI();
            render();
        }

        function constructBuilding(cityId, buildingKey) {
            const city = game.settlements.find(s => s.id == cityId);
            const bConfig = BUILDINGS[buildingKey];
            const pFac = game.factions[game.playerFactionId];

            if (pFac.gold < bConfig.costGold) {
                game.addLog("黃金不足，無法興建該建築！");
                audio.click();
                return;
            }

            pFac.gold -= bConfig.costGold;
            city.buildings.push(buildingKey);

            audio.settle();
            game.addLog(`🏗️ 在 <strong>${city.name}</strong> 興建了 <strong>${bConfig.name}</strong>！`);
            
            openCityModal(city);
            updateUI();
            render();
        }

        function checkSavedGame() {
            try {
                const dataStr = localStorage.getItem('isles_of_conquest_save');
                const banner = document.getElementById('continue-banner');
                if (dataStr) {
                    const data = JSON.parse(dataStr);
                    const fac = FACTIONS[data.playerFactionId] || {};
                    document.getElementById('continue-info-title').innerText = `繼續遊戲：${fac.name || '王國'} (第 ${data.turn} 回合)`;
                    document.getElementById('continue-info-sub').innerText = `公元 ${data.year || 800} 年 | 已自動保存進度`;
                    banner.classList.remove('hidden');
                } else {
                    banner.classList.add('hidden');
                }
            } catch(e) {
                console.error(e);
            }
        }

        function exitToMainMenu() {
            audio.click();
            saveGame(); // 自動保存當前狀態
            document.getElementById('modal-menu').classList.add('hidden');
            document.getElementById('modal-faction-select').classList.remove('hidden');
            checkSavedGame();
        }

        function saveGame() {
            try {
                const saveData = {
                    turn: game.turn,
                    year: game.year,
                    playerFactionId: game.playerFactionId,
                    factions: game.factions,
                    units: game.units,
                    settlements: game.settlements,
                    map: game.map
                };
                localStorage.setItem('isles_of_conquest_save', JSON.stringify(saveData));
                game.addLog("遊戲進度已成功儲存至本地儲存區！");
                audio.click();
            } catch(e) {
                game.addLog("儲存遊戲進度失敗。");
            }
        }

        function loadGame() {
            try {
                const dataStr = localStorage.getItem('isles_of_conquest_save');
                if (!dataStr) {
                    game.addLog("未找到有效的存檔紀錄。");
                    return;
                }
                const data = JSON.parse(dataStr);
                game.turn = data.turn;
                game.year = data.year;
                game.playerFactionId = data.playerFactionId;
                game.factions = data.factions;
                game.units = data.units;
                game.settlements = data.settlements;
                game.map = data.map;

                audio.click();
                game.addLog("已成功載入遊戲進度！");
                document.getElementById('modal-menu').classList.add('hidden');
                document.getElementById('modal-faction-select').classList.add('hidden');
                
                const myCapital = game.settlements.find(s => s.factionId === game.playerFactionId);
                if (myCapital) {
                    centerCameraOn(myCapital.x, myCapital.y);
                }

                updateUI();
                render();
            } catch(e) {
                game.addLog("載入遊戲存檔時發生錯誤。");
            }
        }

        document.getElementById('btn-start-game').addEventListener('click', () => {
            audio.click();
            game.turn = 1;
            game.year = 800;
            game.enableFog = document.getElementById('chk-fog').checked;
            game.initMap();
            game.setupFactions();
            game.spawnStartingEntities();

            document.getElementById('modal-faction-select').classList.add('hidden');

            const startPos = FACTIONS[game.playerFactionId].startPos;
            centerCameraOn(startPos.x, startPos.y);

            updateUI();
            render();
        });

        document.getElementById('btn-continue-game').addEventListener('click', () => {
            loadGame();
        });

        document.getElementById('btn-exit-top').addEventListener('click', exitToMainMenu);
        document.getElementById('btn-exit-to-main').addEventListener('click', exitToMainMenu);

        document.getElementById('btn-end-turn').addEventListener('click', () => {
            audio.click();
            game.processTurn();
            updateUI();
            render();
        });
        document.getElementById('btn-religion').addEventListener('click', openReligionModal);
        document.getElementById('btn-tech').addEventListener('click', openTechModal);

        document.getElementById('btn-audio').addEventListener('click', () => {
            audio.enabled = !audio.enabled;
            const icon = document.getElementById('audio-icon');
            icon.className = audio.enabled ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark';
        });

        document.getElementById('btn-menu').addEventListener('click', () => {
            audio.click();
            document.getElementById('modal-menu').classList.remove('hidden');
        });

        document.getElementById('btn-save').addEventListener('click', saveGame);
        document.getElementById('btn-load').addEventListener('click', loadGame);

        document.getElementById('btn-restart').addEventListener('click', () => {
            location.reload();
        });

        document.querySelectorAll('.btn-close-modal').forEach(btn => {
            btn.addEventListener('click', () => {
                btn.closest('.fixed').classList.add('hidden');
            });
        });

        window.onload = function() {
            game.initMap();
            resizeCanvas();
            initFactionSelectionModal();
            checkSavedGame();
        };
    </script>
</body>
</html>
